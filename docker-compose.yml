name: taskmaster

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: taskmaster
      POSTGRES_PASSWORD: taskmaster
      POSTGRES_DB: taskmaster
    ports:
      - "5433:5432"
    volumes:
      - taskmaster_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskmaster -d taskmaster"]
      interval: 3s
      timeout: 3s
      retries: 10

  migrate:
    build: .
    command: python scripts/migrate.py
    environment:
      DATABASE_URL: postgresql://taskmaster:taskmaster@postgres:5432/taskmaster
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    environment:
      DATABASE_URL: postgresql://taskmaster:taskmaster@postgres:5432/taskmaster
      JWT_SECRET: change-this-development-secret-32-bytes-minimum
    ports:
      - "8001:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  taskmaster_data:
